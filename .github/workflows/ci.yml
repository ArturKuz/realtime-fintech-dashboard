name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Only the Pages deploy job gets write access (see below).
permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the exact pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/realtime-fintech-dashboard/browser

  deploy:
    # Deploy only green builds of main; other branches and PRs just run the checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer push waits instead of cancelling a running deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
